name: verify
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: gitleaks git --redact=100 --log-opts=--all --report-format json --report-path /tmp/careflow-secrets.json .
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f backend/pom.xml spotless:check verify
      - run: mvn -B -f sdk/java/pom.xml spotless:check verify
      - run: mvn -B -f backend/pom.xml dependency:list -DincludeScope=runtime -DoutputFile=/tmp/careflow-backend-deps.txt
      - run: python3 scripts/audit-maven.py /tmp/careflow-backend-deps.txt --output /tmp/careflow-backend-audit.json
      - run: mvn -B -f sdk/java/pom.xml dependency:list -DincludeScope=runtime -DoutputFile=/tmp/careflow-sdk-deps.txt
      - run: python3 scripts/audit-maven.py /tmp/careflow-sdk-deps.txt --output /tmp/careflow-sdk-audit.json
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.15'
          python-version: '3.12'
      - run: uv sync --project worker --frozen
      - run: uv run --project worker ruff check worker scripts sdk/python tools/local-models
      - run: uv run --project worker ruff format --check worker scripts sdk/python tools/local-models
      - run: uv run --project worker pytest worker/tests -q
      - run: uv run --project worker pytest scripts/tests -q
      - run: PYTHONPATH=tools/local-models uv run --project worker pytest tools/local-models/tests -q
      - run: PYTHONPATH=sdk/python uv run --project worker pytest sdk/python/tests -q
      - run: uv build --project sdk/python --out-dir sdk/python/dist
      - run: uv export --project worker --frozen --no-dev --no-hashes --no-emit-project --output-file /tmp/careflow-runtime.txt
      - run: uvx --from pip-audit==2.10.1 pip-audit --disable-pip --no-deps -r /tmp/careflow-runtime.txt --format json --output /tmp/careflow-python-audit.json
      - run: python scripts/check-python-audit.py /tmp/careflow-python-audit.json
      - run: uv export --project tools/local-models --frozen --no-dev --no-hashes --no-emit-project --output-file /tmp/careflow-model-runtime.txt
      - run: uvx --from pip-audit==2.10.1 pip-audit --disable-pip --no-deps -r /tmp/careflow-model-runtime.txt --format json --output /tmp/careflow-model-audit.json
      - run: python scripts/check-python-audit.py /tmp/careflow-model-audit.json --torch-cpu-requirements /tmp/careflow-model-runtime.txt
  milvus-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.15'
          python-version: '3.12'
      - run: uv sync --project worker --frozen
      - run: python3 scripts/init-local-env.py
      - run: docker compose -p careflow-ci up -d --wait --wait-timeout 300 etcd minio milvus
      - run: uv run --project worker pytest worker/tests/test_milvus_integration.py -q
        env:
          RUN_MILVUS_INTEGRATION: '1'
          MILVUS_URI: http://127.0.0.1:19530
      - if: always()
        run: docker compose -p careflow-ci down --volumes
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: python3 scripts/check-license-files.py
      - run: npm test --prefix web
      - run: npx playwright-core install --with-deps chromium
        working-directory: web
      - run: npm run test:browser --prefix web
      - run: npm run build --prefix web
      - run: npm audit --prefix web --omit=dev --audit-level=high
