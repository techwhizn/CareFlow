name: verify
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f backend/pom.xml spotless:check verify
      - run: mvn -B -f sdk/java/pom.xml spotless:check verify
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.15'
          python-version: '3.12'
      - run: uv sync --project worker --frozen
      - run: uv run --project worker ruff check worker scripts sdk/python
      - run: uv run --project worker ruff format --check worker scripts sdk/python
      - run: uv run --project worker pytest worker/tests -q
      - run: PYTHONPATH=sdk/python uv run --project worker pytest sdk/python/tests -q
      - run: uv build --project sdk/python --out-dir sdk/python/dist
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: npm audit --prefix web --omit=dev --audit-level=high
