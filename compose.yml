x-worker-sandbox: &worker-sandbox
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    - /app/cache:rw,noexec,nosuid,size=128m,uid=10001,gid=10001,mode=0700

services:
  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_DATABASE: careflow
      MYSQL_USER: careflow
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.1.4-management
    environment:
      RABBITMQ_DEFAULT_USER: careflow
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbit-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-careflow}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["s3-data:/data"]
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
      ETCD_SNAPSHOT_COUNT: '50000'
    volumes: ["etcd-data:/etcd"]
  milvus:
    image: milvusdb/milvus:v2.6.1
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-careflow}
      MINIO_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    ports: ["127.0.0.1:19530:19530"]
    volumes:
      - "milvus-data:/var/lib/milvus"
      - "./deploy/milvus-user.yaml:/milvus/configs/user.yaml:ro"
    depends_on: [etcd, minio]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 30
  backend:
    build: ./backend
    env_file: .env
    environment:
      BIND_ADDRESS: 0.0.0.0
      DATABASE_URL: jdbc:mysql://mysql:3306/careflow
      RABBITMQ_HOST: rabbitmq
      S3_ENDPOINT: http://minio:9000
      WORKER_URL: http://worker-api:8090
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      mysql: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
  worker-api:
    <<: *worker-sandbox
    build: ./worker
    env_file: .env
    environment:
      MILVUS_URI: http://milvus:19530
    command: ["uvicorn", "careflow.api:app", "--host", "0.0.0.0", "--port", "8090"]
    depends_on:
      milvus: {condition: service_healthy}
  worker-consumer:
    <<: *worker-sandbox
    build: ./worker
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    env_file: .env
    environment:
      MILVUS_URI: http://milvus:19530
      BACKEND_URL: http://backend:8080
      RABBITMQ_HOST: rabbitmq
    command: ["python", "-m", "careflow.consumer"]
    depends_on: [backend, milvus]
  web:
    build: ./web
    ports: ["127.0.0.1:5173:80"]
    depends_on: [backend]
volumes:
  mysql-data:
  rabbit-data:
  s3-data:
  etcd-data:
  milvus-data:
