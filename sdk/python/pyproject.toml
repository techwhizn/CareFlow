[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "careflow-sdk"
version = "0.1.0"
description = "Python client for the CareFlow public API"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28.1,<0.29"]

[tool.ruff]
target-version = "py310"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
