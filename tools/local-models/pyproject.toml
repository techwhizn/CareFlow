[project]
license = "Apache-2.0"
name = "careflow-local-models"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.35.0", "httpx==0.28.1",
  "torch>=2.6,<3", "transformers==5.17.0", "safetensors>=0.5,<1",
]
[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.12.12"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
environments = ["sys_platform == 'linux'"]
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
