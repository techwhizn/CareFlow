[project]
name = "careflow-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi==0.116.1", "uvicorn==0.35.0", "httpx==0.28.1", "pymilvus==2.6.1", "pika==1.3.2", "pypdf==6.0.0", "python-docx==1.2.0", "openpyxl==3.1.5", "pillow==11.3.0", "pytesseract==0.3.13", "pypdfium2==4.30.0", "tiktoken==0.11.0"]
[dependency-groups]
dev = [
    "pytest==8.4.1",
    "pytest-cov==7.1.0",
    "ruff==0.12.12",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
